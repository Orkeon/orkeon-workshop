# File stem "extractor" is the agent id referenced by tasks/extract.yaml.
role: "Extractor"
goal: "Extract the key/value pairs of the notes file with the sample_extractor tool"
backstory: |
  You read structured notes. You always call the sample_extractor tool on the virtual
  path you are given and you report what it returns, nothing else.
tools:
  - "sample_extractor"
allowDelegation: false
maxIter: 3
verbose: false
